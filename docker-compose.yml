services:
  # ==============================================================================
  # HUCEMS APPLICATION WEB SERVICE
  # ==============================================================================
  hucems-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hucems_app
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_CONNECTION_STRING=${DATABASE_CONNECTION_STRING}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - hucems-mysql
    networks:
      - hucems-network

  # ==============================================================================
  # MYSQL 8.0 DATABASE ENGINE
  # ==============================================================================
  hucems-mysql:
    image: mysql:8.0
    container_name: hucems_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-university_event_management}
    volumes:
      - hucems_mysql_data:/var/lib/mysql
      - ./Database/university_event_management.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hucems-network

networks:
  hucems-network:
    driver: bridge

volumes:
  hucems_mysql_data:
